databaseChangeLog:
  - changeSet:
      id: 001-create-payments-collection
      author: ashkelyonok
      changes:
        - createCollection:
            collectionName: payments
  - changeSet:
      id: 002-create-payments-indexes
      author: ashkelyonok
      changes:
        - createIndex:
            collectionName: payments
            keys: "{ user_id: 1 }"
            options: "{ name: 'idx_user_id' }"
        - createIndex:
            collectionName: payments
            keys: "{ order_id: 1 }"
            options: "{ unique: true, name: 'idx_order_id' }"
        - createIndex:
            collectionName: payments
            keys: "{ status: 1, timestamp: -1 }"
            options: "{ name: 'idx_status_timestamp' }"
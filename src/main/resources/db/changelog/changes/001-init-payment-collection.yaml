databaseChangeLog:
  - changeSet:
      id: 001-create-payments-collection
      author: ashkelyonok
      changes:
        - mongoCreateCollection:
            collectionName: payments
  - changeSet:
      id: 002-create-payments-indexes
      author: ashkelyonok
      changes:
        - mongoCreateIndex:
            collectionName: payments
            indexName: idx_user_id
            keys:
              userId: 1
        - mongoCreateIndex:
            collectionName: payments
            indexName: idx_order_id
            keys:
              orderId: 1
            options:
              unique: true
        - mongoCreateIndex:
            collectionName: payments
            indexName: idx_status_created_at
            keys:
              status: 1
              createdAt: -1